BasicInfo:
  topic:  Multimodal Large Language Models
  base_dir: ./outputs
  cache_path: ./database
  save_path: ./outputs/test/survey.md
  save_json_path: ./outputs/test/survey.json
  evaluation_save_path: ./outputs/test/eval.txt
  debug: True
  error_conservatism_mode: False
  skip_exist: True
  adapter_mode: False
APIInfo:
  llm_provider: qwen
  llm_api_key: "${oc.env:DASHSCOPE_API_KEY,''}"
  llm_api_base_url: "${oc.env:DASHSCOPE_BASE_URL,'https://dashscope.aliyuncs.com/compatible-mode/v1'}"
  llm_model_name: qwen3.6-flash
  llm_max_context_length: 880000
  use_stream_mode: False
  batch_chat_agent_worker: 4
  chat_timeout: 600
  batch_chat_timeout: 1800
  openalex_api_key: "${oc.env:OPENALEX_API_KEY,''}"
  semantic_scholar_api_key:
  low_flow_mode: False
  low_flow_latency: 0
  exponential_backoff: True
  exponential_backoff_time: 1
  exponential_backoff_max_time: 60
  arxiv_api_max_retry: 3
  semantic_scholar_api_max_retry: 3
ModuleInfo:
  WorkCollector:
    download_safe_mode: False
    download_timeout: 60
    download_in_parallel: True
    download_parallel_workers: 4
    pdf_parse_batch_size: 1
    fulltext_per_host_concurrency: 2
    fulltext_access_context_generation: "anonymous-v1"
    fulltext_provenance_enabled: true
    cache_enabled: True
    # OpenAlex is the literature-discovery provider; do not emit arXiv lanes.
    enable_arxiv_discovery: false
    max_seed_paper_num: 18
    use_seed_filter_LLM: True
    LLM_seed_threshold: 4
    reference_graph_depth: 1
    sentence_transformer_model: sentence-transformers/all-MiniLM-L6-v2
    sentence_transformer_batch_size: 32
    expand_in_local_paper_graph: True
    use_ds_when_graph_fail: True
    advanced_filter_in_local_paper_graph_expansion: True
    related_work_top_k: 30  # for debug
    log_related_work_num: -1 # set to -1 to log all
    related_work_threshold: 0.5
    related_work_threshold_for_llm: 4 # 1-5 scale
    relatedness_temperature: 1.0
    RAG_source_use_embedding_filter: True
    RAG_source_use_LLM_filter: False
    RAG_source_downloadable_only: False
    enable_fulltext_expanded_promotion: true
    expanded_fulltext_promotion_candidate_multiplier: 2
    expanded_fulltext_promotion_max_candidates_per_sh: 40
  Database:
    default_top_k: 20
  PaperGraphRetriever:
    db_path: data/processed/graph.db
  WorkAnalyzer:
    abstract_only_mode: False
    cache_enabled: True
    # Citation-expanded papers can be promoted only after the complete-section
    # reader succeeds; local graph keynotes cannot prove that condition.
    use_local_paper_graph_keynotes: false
    use_ds_keynotes_when_graph_fail: True
    graph_keynote_extraction_batch_retry: 7
    graph_graph_keynote_extraction_temperature: 0.1
    paper_reading_temperature: 1.0
    paper_reading_max_retry: 5
    llm_max_context_overhead_length_in_paper_reading: 20000
    clustering_batch_size: 16
    clustering_temperature: 0.5
    clustering_in_steps: True
    clustering_batch_size_in_creation: 6
    clustering_batch_size_in_assignment: 8
    cluster_assign_fast_mode: True
    paper_clustering_max_retry: 10
    paper_clustering_creation_max_retry: 3
    paper_clustering_assignment_max_retry: 10
    propose_question_temperature: 1.0
    anwer_question_temperature: 1.0
    intra_cluster_analysis_max_retry: 10
    intra_cluster_analysis_temperature: 1.0
    intra_clustering_probelm_proposing_max_retry: 10
  SurveyGenerator:
    include_initial_analysis: False
    include_relation_graph: True
    include_relation_table: True
    include_code_report: False
    include_env_report: False
    omit_error_preserve_retry_time: 2
    outline_generation_in_steps: True
    outline_generation_draft_max_retry: 3
    outline_generation_draft_batch_size: 20
    outline_generation_draft_max_iterations: 5
    outline_generation_draft_empty_keynotes_iteration: 1
    outline_draft_RAG_topk: 60
    outline_generation_assign_max_retry: 10
    outline_generation_assign_batch_size: 10
    outline_assign_RAG_topk: 20
    outline_assign_fast_mode: True
    outline_generation_temperature: 0.5
    # Outline prompts use a compact SH-plan projection and must fit before a
    # request is sent; never rely on request-layer prefix truncation.
    outline_prompt_max_input_tokens: 160000
    outline_max_output_tokens: 16000
    outline_evidence_plan_max_input_tokens: 100000
    outline_current_outline_max_input_tokens: 20000
    outline_keynotes_max_input_tokens: 70000
    outline_analysis_max_input_tokens: 12000
    outline_rag_max_input_tokens: 12000
    outline_repair_previous_response_max_input_tokens: 8000
    outline_repair_current_outline_max_input_tokens: 8000
    # The outline sees a SH-covering representative set.  Assignment still
    # considers every admitted paper after the outline shape is fixed.
    outline_representative_papers_per_sh: 4
    outline_representative_max_papers: 30
    outline_representative_include_context_papers: true
    # Whole-survey contract. Per-section/subsection prompts are derived from
    # the accepted outline; the 33.3k/40k total budget permits up to 2k words
    # per subsection for the target outline.
    survey_target_words: 32000
    survey_max_words: 40000
    writing_max_papers_per_sh: 20
    outline_min_sections: 5
    outline_target_sections: 6
    outline_max_sections: 7
    outline_min_subsections_per_section: 1
    outline_target_subsections_per_section: 3
    outline_max_subsections_per_section: 3
    subsection_target_min_words: 875
    subsection_target_max_words: 2000
    subsection_target_citations: 3
    subsection_max_citations: 5
    section_preamble_target_words: 250
    section_preamble_max_words: 400
    section_preamble_target_citations: 1
    section_preamble_max_citations: 2
    outline_generation_batch_size: 16
    outline_generation_max_retry: 3
    outline_generation_max_retry_in_generation_loop: 6
    subsection_draft_temperature: 1.0
    subsection_draft_max_retry: 5
    # Temporary operational bypass: keep visible citation checks, but do not
    # block drafting on LLM-generated claim-trace metadata.
    claim_trace_validation_enabled: false
    claim_trace_repair_max_attempts: 2
    claim_trace_repair_max_output_tokens: 2048
    section_draft_max_retry: 5
    always_omit_error_in_draft_validation: True
    section_draft_temperature: 1.0
    draft_refinement_temperature: 1.0
    section_draft_max_error_info_length: 500
    subsection_draft_max_error_info_length: 500
    outline_max_error_info_length: 500
    llm_max_context_overhead_length_generation: 20000
    llm_max_context_overhead_length_outline_generation: 10000
    # Legacy keys retained for external overrides; new drafting uses the
    # whole-survey budget above rather than these per-unit hard minima.
    subsection_least_words: 875
    subsection_least_citations: 3
    section_least_words: 4250
    section_preamble_least_words: 250
    section_preamble_least_citations: 3
    draft_length_relax_ratio: 0.1
    use_full_text_in_survey_generation: False
    include_other_relevant_papers_RAG_in_outline: True
    outline_RAG_topk: 200
    include_other_relevant_papers_RAG: True
    section_RAG_topk: 60
    subsection_RAG_topk: 60
    use_title_in_draft: True
    enable_review_and_revise: True
    agentic_refine_section: True
    section_review_temperature: 1.0
    section_review_retry: 3
    reviewer_max_suggestions: 5
    section_revision_RAG_topk: 30
    section_revise_temperature: 0.5
    section_revise_retry: 5
    no_suggestion_run_each_iteration: 1
    max_review_revise_iterations: 5
    revise_section_in_parallel: 1
    draft_refinement_in_parts: True
    refine_in_parts_mode: 2
    draft_refinement_max_retry: 7
    review_and_revise_whole_survey_in_refinement: True
    agentic_refine_survey: True
    review_and_revise_whole_survey_max_iteration: 5
    valid_title_min_similarity: 0.5
  CodeAnalysis:
    PseudoCreator:
      planner_temperature: 0.5
      planner_max_retry: 3
  Judge:
    skip_evaluation: False
    use_different_api_for_judge: False
    model: qwen3.7-plus
    judge_llm_api_key: 
    judge_llm_api_base_url: 
    nli_temperature: 0.1
    citation_quality_threshold: 0.5
    remove_failed_citation_in_eval: True
    rubrics_eval_10_dimensions: True
    rubrics_eval_4_dimensions: False
    rubrics_deep_survey_eval: False
    explanation_in_rubric: True
    citation_eval: False
